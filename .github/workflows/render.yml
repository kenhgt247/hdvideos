name: Dung video
run-name: "job ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Mã việc"
        required: true
      job:
        description: "Nội dung (JSON)"
        required: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nho thu vien
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt') }}-v2

      - name: Nho mo hinh giong doc
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/vieneu
          key: vieneu-models-v1

      - name: Cai thu vien
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -r requirements.txt
          ~/venv/bin/pip install vieneu --extra-index-url https://download.pytorch.org/whl/cpu || echo "Khong cai duoc VieNeu"

      - name: Dung video
        env:
          JOB: ${{ inputs.job }}
        run: |
          printf '%s' "$JOB" > job.json
          ~/venv/bin/python render.py job.json out

      - name: Dua video len
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [ -f out/info.json ] || echo '{"ok": false, "error": "Máy dựng bị dừng giữa chừng."}' > out/info.json
          TAG="job-$JOB_ID"
          if grep -q '"preview": true' out/info.json; then TAG="prev-$JOB_ID"; fi
          FILE=$(python3 -c "import json;print(json.load(open('out/info.json')).get('file','video.mp4'))")
          ASSETS="out/info.json"
          if [ -f out/video.mp4 ] && grep -q '"ok": true' out/info.json; then
            mv out/video.mp4 "out/$FILE"; ASSETS="$ASSETS out/$FILE"
          fi
          for f in out/c*.jpg; do [ -f "$f" ] && ASSETS="$ASSETS $f"; done
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" $ASSETS --title "$TAG" --notes-file out/info.json --prerelease
