name: Phan tich video
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
jobs:
  pt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tai video
        env:
          URL: ${{ inputs.url }}
        run: |
          pip install -q yt-dlp faster-whisper imageio-ffmpeg pillow
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p o
          yt-dlp --ffmpeg-location "$FF" -f "bv*[height<=720]+ba/b[height<=720]/b" --merge-output-format mp4 -o o/v.mp4 --write-info-json "$URL" || yt-dlp -f b -o o/v.mp4 --write-info-json "$URL"
          ls -la o
      - name: Cat anh va chuyen loi noi
        run: |
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          cd o
          $FF -loglevel error -i v.mp4 -vf "fps=1,scale=270:-2" f_%03d.jpg
          $FF -loglevel error -i v.mp4 -vf "select='gt(scene,0.25)',showinfo,scale=270:-2" -vsync vfr s_%03d.jpg 2> scenes.txt || true
          grep -o "pts_time:[0-9.]*" scenes.txt > cuts.txt || true
          $FF -loglevel error -i v.mp4 -ac 1 -ar 16000 a.wav
          python - <<'PY'
          import json, glob
          from PIL import Image
          from faster_whisper import WhisperModel
          fs = sorted(glob.glob('f_*.jpg'))
          for k in range(0, len(fs), 30):
              ims = [Image.open(f) for f in fs[k:k+30]]
              w, h = ims[0].size
              sheet = Image.new('RGB', (6 * (w + 4), 5 * (h + 4)), (60, 60, 60))
              for i, im in enumerate(ims):
                  sheet.paste(im, ((i % 6) * (w + 4), (i // 6) * (h + 4)))
              sheet.save('sheet_%02d.jpg' % (k // 30), quality=80)
          m = WhisperModel('small', device='cpu', compute_type='int8')
          segs, info = m.transcribe('a.wav', language='vi', vad_filter=True)
          with open('loi.txt', 'w', encoding='utf-8') as fh:
              for s in segs:
                  fh.write('[%6.1f - %6.1f] %s\n' % (s.start, s.end, s.text.strip()))
          meta = json.load(open(glob.glob('*.info.json')[0])) if glob.glob('*.info.json') else {}
          keep = {k: meta.get(k) for k in ('title', 'uploader', 'channel', 'upload_date', 'duration', 'view_count', 'like_count', 'comment_count', 'description', 'width', 'height', 'channel_follower_count')}
          json.dump(keep, open('meta.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          PY
          ls
      - uses: actions/upload-artifact@v4
        with:
          name: ketqua
          retention-days: 1
          path: |
            o/sheet_*.jpg
            o/loi.txt
            o/meta.json
            o/cuts.txt
