name: Don video cu
on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Xoa video qua 60 ngay
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          CUT=$(date -d '60 days ago' +%s)
          gh release list -R "$REPO" -L 1000 --json tagName,createdAt \
            --jq ".[] | select(.tagName|startswith(\"job-\")) | select((.createdAt|fromdateiso8601) < $CUT) | .tagName" |
          while read t; do gh release delete "$t" -R "$REPO" --yes --cleanup-tag; done
          CUT2=$(date -d '2 days ago' +%s)
          gh release list -R "$REPO" -L 1000 --json tagName,createdAt \
            --jq ".[] | select(.tagName|startswith(\"prev-\")) | select((.createdAt|fromdateiso8601) < $CUT2) | .tagName" |
          while read t; do gh release delete "$t" -R "$REPO" --yes --cleanup-tag; done
